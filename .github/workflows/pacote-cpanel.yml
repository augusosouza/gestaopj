name: Publicar pacote cPanel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release já publicada ou em rascunho
        required: true
        type: string

permissions:
  contents: read

jobs:
  validar:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/tests.yml

  pacote:
    needs: validar
    permissions:
      contents: write
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, iconv, intl, mbstring, pdo_mysql, simplexml, sodium, xmlreader, xmlwriter, zip
          coverage: none
      - name: Conferir a revisão da release
        env:
          GH_TOKEN: ${{ github.token }}
          AUGI_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          target=$(gh release view "$AUGI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          test "$target" = "$GITHUB_SHA"
      - name: Gerar ZIP sem código de ativação
        run: |
          sh scripts/pacote-cpanel.sh "$RUNNER_TEMP/augi" --sem-ativacao
          mv "$RUNNER_TEMP/augi/augi-cpanel-"*.zip "$RUNNER_TEMP/augi/augi-cpanel.zip"
          cp scripts/ativar-instalador.html "$RUNNER_TEMP/augi/"
          cd "$RUNNER_TEMP/augi"
          sha256sum augi-cpanel.zip ativar-instalador.html > SHA256SUMS.txt
      - name: Conferir conteúdo e integridade do ZIP
        run: |
          cd "$RUNNER_TEMP/augi"
          sha256sum -c SHA256SUMS.txt
          unzip -tq augi-cpanel.zip
          python3 - <<'PYZIP'
          from zipfile import ZipFile

          with ZipFile("augi-cpanel.zip") as pacote:
              nomes = set(pacote.namelist())
              esperados = {"augi/.htaccess", "augi/public/.htaccess", "augi/public/index.php",
                           "augi/public/instalar.php", "augi/vendor/autoload.php"}
              proibidos = {"augi/.env", "augi/.env.instalacao", "augi/storage/app/instalador.sha256",
                           "augi/bootstrap/cache/config.php", "augi/public/.augi-root.php"}
              if not esperados <= nomes or nomes & proibidos:
                  raise SystemExit("Pacote incompleto ou contém configuração privada da instalação.")
          PYZIP
      - name: Enviar arquivos à release
        env:
          GH_TOKEN: ${{ github.token }}
          AUGI_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd "$RUNNER_TEMP/augi"
          gh release upload "$AUGI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" augi-cpanel.zip ativar-instalador.html SHA256SUMS.txt
