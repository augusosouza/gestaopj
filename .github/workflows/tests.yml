name: Tests

on:
  push:
  workflow_call:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, curl, fileinfo, iconv, intl, libxml, mbstring, openssl, pcntl, pdo_sqlite, simplexml, sodium, xmlreader, xmlwriter, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

  recuperacao-mariadb:
    name: Recuperação em MariaDB 10.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: teste-raiz-augi
          MARIADB_DATABASE: augi_recuperacao_test
          MARIADB_USER: augi_test
          MARIADB_PASSWORD: teste-augi
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, iconv, intl, mbstring, openssl, pcntl, pdo_mysql, simplexml, sodium, xmlreader, xmlwriter, zip
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Homologar backup e tarifas em banco descartável
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          DB_DATABASE: augi_recuperacao_test
          DB_USERNAME: augi_test
          DB_PASSWORD: teste-augi
        run: php artisan test --filter 'test_base_incremental_e_restauracao_de_qualquer_ponto|test_incremental_sem_pacote_base_preserva_banco_e_arquivos|test_recebimento_bruto_tarifa|test_debito_de_tarifa|test_mes_fechado_pelo_contador|test_previa_da_baixa_rapida|test_duas_baixas_concorrentes'
